<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Pre-rendered pages carry a plain-HTML copy of their content for crawlers
         (scripts/prerender.ts). Hide it for anyone running JavaScript; React
         replaces it on start-up. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js [data-prerender]{display:none}</style>

    <title>Tern Technologies — Industrial Hardware Distribution</title>
    <meta
      name="description"
      content="Industrial grade hardware solutions for enterprise-scale deployments and high-performance computing systems. Engineered for reliability, delivered all over Pakistan."
    />
    <link rel="canonical" href="https://terntechshop.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tern Technologies" />
    <meta property="og:title" content="Tern Technologies — Industrial Hardware Distribution" />
    <meta
      property="og:description"
      content="Industrial grade hardware for enterprise-scale deployments, delivered all over Pakistan."
    />
    <meta property="og:url" content="https://terntechshop.com/" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Preconnect so the font CSS and files resolve on one round trip. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Tern Technologies",
        "url": "https://terntechshop.com/",
        "email": "info@terntechshop.com",
        "telephone": "+92-316-4587553",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Office No. 11, Muhammadi Plaza, Jinnah Avenue, Blue Area, F-6/1",
          "addressLocality": "Islamabad",
          "addressCountry": "PK"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
